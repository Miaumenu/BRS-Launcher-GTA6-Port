# Copy this file to `gambiarra-cli.toml` (git-ignored) and set local paths.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# GAMBIARRA_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: GAMBIARRA_GAME_DIR
game_dir = 'D:\gambiarra-cli-data\game'

# Derived data. Default: %LOCALAPPDATA%\gambiarra\cache.   env: GAMBIARRA_CACHE_DIR
# cache_dir = 'D:\gambiarra-cli-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\gambiarra\data.   env: GAMBIARRA_DATA_DIR
# data_dir = 'D:\gambiarra-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: GAMBIARRA_TEST_TITLES (separated by ';')
test_titles = []
