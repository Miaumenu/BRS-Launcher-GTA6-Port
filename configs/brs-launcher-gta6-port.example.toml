# Copy this file to `sixm-multiversion.toml` (git-ignored) and set local paths.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# SIXM_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: SIXM_GAME_DIR
game_dir = 'D:\sixm-multiversion-data\game'

# Derived data. Default: %LOCALAPPDATA%\sixm\cache.   env: SIXM_CACHE_DIR
# cache_dir = 'D:\sixm-multiversion-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\sixm\data.   env: SIXM_DATA_DIR
# data_dir = 'D:\sixm-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: SIXM_TEST_TITLES (separated by ';')
test_titles = []
