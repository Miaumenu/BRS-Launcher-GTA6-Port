[package]
name = "sixm-multiversion"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sixm-core.workspace = true
sixm-pe.workspace = true
sixm-loader.workspace = true
sixm-hle.workspace = true
sixm-shader = { workspace = true, features = ["host"] }
sixm-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "sixm-core/diagnostics",
    "sixm-hle/diagnostics",
    "sixm-loader/diagnostics",
    "sixm-shader/diagnostics",
]

[lints]
workspace = true
