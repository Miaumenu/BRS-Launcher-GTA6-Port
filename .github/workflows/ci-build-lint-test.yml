name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        # The inherited prototype currently has existing Clippy warnings.
        # Keep reporting them while compile errors remain fatal; tighten this
        # back to -D warnings after the baseline is cleaned up.
        # Integration tests use CARGO_BIN_EXE, which cargo test defines but
        # cargo clippy --all-targets does not. They run in the Tests step.
        run: cargo clippy --workspace --locked
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-features --locked
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release CLI
        run: cargo build --release -p sixm-multiversion --locked
