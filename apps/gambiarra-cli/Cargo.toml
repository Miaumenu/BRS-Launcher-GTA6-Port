[package]
name = "gambiarra-cli"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gambiarra-core.workspace = true
gambiarra-pe.workspace = true
gambiarra-loader.workspace = true
gambiarra-hle.workspace = true
gambiarra-shader = { workspace = true, features = ["host"] }
gambiarra-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "gambiarra-core/diagnostics",
    "gambiarra-hle/diagnostics",
    "gambiarra-loader/diagnostics",
    "gambiarra-shader/diagnostics",
]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Only what the preset probe queries: the adapter's identity and the three
# capability structures a preset can match on. See src/probe.rs.
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
